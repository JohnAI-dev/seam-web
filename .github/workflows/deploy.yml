name: Deploy
# Runs on the self-hosted runner installed on prod1.
on:
  push:
    branches: [main]
    paths: [site/**]
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy-prod1
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: [self-hosted, prod1]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - name: Publish the site
        run: |
          # New setup: container with the site folder mounted at /deploy, served on :8080
          # in the same pod. Old setup: host nginx serving /var/www/seam-web on :80.
          if [ -d /deploy ]; then target=/deploy; url=http://127.0.0.1:8080/
          else target=/var/www/seam-web; url=http://127.0.0.1/; fi
          find "$target" -mindepth 1 -delete
          cp -a site/. "$target/"
          echo "SITE_URL=$url" >> "$GITHUB_ENV"
      - name: Smoke test
        run: curl -fsS "$SITE_URL" | cmp - site/index.html
