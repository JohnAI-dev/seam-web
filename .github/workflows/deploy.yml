name: Deploy
# Pull-based: nothing connects in to the server. After the tests pass, this moves the `live`
# branch to the tested commit; the web server fetches `live` every minute and
# publishes it.
on:
  push:
    branches: [main]
    paths: [site/**]
  workflow_call:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - name: Test
        run: bash scripts/test.sh
      - name: Move `live` to this commit
        run: git push --force origin HEAD:refs/heads/live
      - name: Wait until the site serves this version
        # Set the repository variable SITE_URL (e.g. https://seamweb.no/) to enable.
        if: vars.SITE_URL != ''
        run: |
          for i in $(seq 1 30); do
            if curl -fsS -H "Cache-Control: no-cache" "${{ vars.SITE_URL }}?v=$GITHUB_SHA" | cmp -s - site/index.html; then
              echo "live at ${{ vars.SITE_URL }}"; exit 0
            fi
            sleep 10
          done
          echo "::error::the site did not update within 5 minutes"; exit 1
